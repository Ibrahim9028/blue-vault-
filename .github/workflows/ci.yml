

name: Blue Vault CI

on:
  push:
    branches:
      - main
      - ci-cd
      - production-kubernetes
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/home-service/requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile services/home-service/src/app.py

      - name: Build Docker image
        run: |
          docker build -t blue-vault-home:latest services/home-service

      - name: Validate Kubernetes manifests
        run: |
          kubectl apply --dry-run=client -f k8s/
